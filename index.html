<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iter8</title>
  <meta name="description" content="iter8 — lansering inom kort.">
  <meta name="theme-color" content="#21303e">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./iter8-ikon-liggande-beige-pa-navy-32px.png" sizes="32x32">
  <link rel="apple-touch-icon" href="./iter8-ikon-liggande-beige-pa-navy-180px.png">
  <link rel="stylesheet" href="./style.css?v=7">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JF92SKXM2K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JF92SKXM2K');
  </script>
</head>
<body>
  <a class="login" href="https://app.iter8.se">Logga in</a>

  <main class="center-content">
    <img class="symbol" src="./iter8-symbol-liggande-beige.svg" width="84" height="47" alt="iter8">
    <div class="rule" aria-hidden="true"></div>

    <h1>Lansering inom <em>kort</em></h1>

    <!-- Email signup (posts to the Apps Script sheet endpoint in main.js) -->
    <div class="signup-area">
      <form id="signup-form" class="signup-form" onsubmit="return handleSignup(event)">
        <p class="signup-label">Håll dig uppdaterad</p>
        <div class="signup-input-row">
          <input type="email" id="signup-email" placeholder="din@epost.se" required autocomplete="email" aria-label="E-post" />
          <button type="submit" id="signup-btn">Meddela mig</button>
        </div>
      </form>
      <p id="signup-thanks" class="signup-thanks" hidden>Vi hör av oss.</p>
    </div>

    <a href="mailto:lasse@iter8.se" class="contact-link">lasse@iter8.se</a>
  </main>

  <script src="./main.js"></script>
</body>
</html>
