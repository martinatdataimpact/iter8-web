<script>
  /* Temat: ett uttryckligt val (data-theme) vinner, annars följer sidan systemet.
     Mörkt läge är avstängt: <html> bär data-theme="light", så sidan är alltid ljus.
     Ta bort attributet där för att låta sidan följa systemet igen. */
  (function () {
    var root = document.documentElement;
    if (root.hasAttribute('data-theme')) return;
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function apply() { root.setAttribute('data-theme', mq && mq.matches ? 'dark' : 'light'); }
    apply();
    if (mq && mq.addEventListener) mq.addEventListener('change', apply);
  })();
</script>
